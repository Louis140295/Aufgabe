    <style>/*Grundgerüst*/
          body {
            position: relative;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        /* Wasserzeichen - Hintergrund */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url(bilder/hintergrund.jpg);
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            opacity: 0.35;
            z-index: -1;
        }
        /* -- Styling für die Navigation -- */
        nav {
            margin-bottom: 20px;
        }

        nav a {
            display: inline-block;
            background-color: #f1f5f9;
            color: #334155;
            text-decoration: none;
            padding: 10px 18px;
            margin-right: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Effekt für die Maus */
        nav a:hover{
            background-color: #2563eb;
            color: #ffffff
        }

          /* Footer ganz unten */
        footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #cbd5e1;
            text-align: center;
            font-size: 13px;
            color: #64748b
        }
